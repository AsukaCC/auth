name: ${AUTH_PROJECT_NAME:-auth-center}-deploy

services:
  deploy-agent:
    image: ${AUTH_DEPLOY_AGENT_IMAGE:-auth-center-deploy-agent:local}
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    # This service manages Docker; it is separate from the unprivileged app.
    user: "0:0"
    environment:
      AUTH_INSTALL_DIR: /deployment
      AUTH_UPDATE_REPOSITORY: "${AUTH_UPDATE_REPOSITORY:-AsukaCC/auth}"
      AUTH_GITHUB_TOKEN_FILE: "${AUTH_GITHUB_TOKEN_FILE:-}"
    volumes:
      - .:/deployment
      - /var/run/docker.sock:/var/run/docker.sock
      - auth-control:/run/auth-deploy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # Allow an in-flight update to finish before stopping the agent.
    stop_grace_period: 21m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auth-control:
    external: true
    name: ${AUTH_PROJECT_NAME:-auth-center}_auth-control
