name: auth-center

services:
  auth:
    image: auth-center:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${AUTH_BIND_ADDRESS:-127.0.0.1}:${AUTH_PORT:-8080}:8080"
    environment:
      AUTH_ADDR: "0.0.0.0:8080"
      AUTH_DATA_DIR: /data
      AUTH_WEB_DIR: /app/web/dist
      AUTH_PUBLIC_URL: "${AUTH_PUBLIC_URL:-http://127.0.0.1:8080}"
      AUTH_SECURE_COOKIE: "${AUTH_SECURE_COOKIE:-false}"
    volumes:
      - auth-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auth-data:
